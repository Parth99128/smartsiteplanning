server.port=${SERVER_PORT:8080}

spring.application.name=floodshield-backend
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/floodshield}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:floodshield}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:floodshield}
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
# Recycle connections before firewalls/NAT drop them; probe idle ones so
# sleep/hibernate and DB restarts don't poison the pool.
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1

# Don't kill in-flight analyze/simulate on SIGTERM; give them 30s.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
ml.service.timeout-ms=${ML_TIMEOUT_MS:10000}

# Actuator — expose only health + info publicly
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# Logging
logging.level.root=INFO
logging.level.com.floodshield=${APP_LOG_LEVEL:INFO}
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%15.15t] %-40.40logger{39} : %msg%n

# CORS — comma-separated allowed origins (dev ports 5173/5174 + preview 4173)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:4173}
